# Render Blueprint for ContractLens AI
#
# Architecture (one origin, no extra infrastructure):
#   contractlens-ai     Docker web service (free plan): FastAPI API + built React app + embedded background worker
#   PostgreSQL          application data, job queue AND private document storage (STORAGE_BACKEND=database)
#
# Database choice (current deployment): Render allows one free PostgreSQL instance per workspace and this workspace's
# free instance is already in use ("remixfox-db"). To stay on free plans, ContractLens uses that existing instance and
# keeps ALL of its tables in a dedicated PostgreSQL schema (DATABASE_SCHEMA=contractlens), separate from the other
# application's tables. Note: free Render databases are deleted 30 days after creation unless upgraded, and the instance
# has 1 GB of storage shared by both applications.
#
# Dedicated (recommended for real data, ~$6/month + storage): replace the DATABASE_URL entry with
#   fromDatabase: { name: contractlens-db, property: connectionString }
# remove DATABASE_SCHEMA, and add at the end of this file:
#   databases:
#     - name: contractlens-db
#       databaseName: contractlens
#       user: contractlens
#       plan: basic-256mb
#       region: frankfurt
#       ipAllowList: []
#
# Why documents live in PostgreSQL: Render's container filesystem is ephemeral, so files written to disk are lost on
# every deploy/restart. Storing file bytes in the private database keeps them persistent, transactional and never
# publicly addressable. For large volumes switch to S3-compatible storage (STORAGE_BACKEND=s3, see INSTRUCTION.md).
#
# Background jobs are rows in PostgreSQL, so they survive restarts and free-instance spin-downs. To move processing
# off the web instance (paid plans only), add a worker service running `python -m app.worker` with the same
# environment and set RUN_WORKER_IN_API=false on the web service.
#
# The free web plan sleeps after ~15 minutes idle (the first request then takes about a minute).
#
# Secrets: JWT_SECRET_KEY and ENCRYPTION_KEY are generated by Render. AI keys are optional and entered in the dashboard
# (sync: false) - they are never stored in this file.

services:
  - type: web
    name: contractlens-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: remixfox-db
          property: connectionString
      - key: DATABASE_SCHEMA
        value: contractlens
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: database
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MAX_PDF_PAGES
        value: "300"
      - key: PROCESSING_TIMEOUT_SECONDS
        value: "180"
      - key: DOCS_ENABLED
        value: "false"
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: none            # set to openai | anthropic | gemini after adding the matching key
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

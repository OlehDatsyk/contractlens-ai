# Render Blueprint for ContractLens AI
#
# Architecture (one origin, no extra infrastructure):
#   contractlens-ai     Docker web service: FastAPI API + built React app + embedded background worker
#   contractlens-db     Render PostgreSQL: application data AND private document storage (STORAGE_BACKEND=database)
#
# Why documents live in PostgreSQL: Render's container filesystem is ephemeral, so files written to disk are lost on
# every deploy/restart. Storing file bytes in the private database keeps them persistent, transactional, backed up with
# the database and never publicly addressable. For large volumes switch to S3-compatible storage (see INSTRUCTION.md):
# set STORAGE_BACKEND=s3 and the OBJECT_STORAGE_* variables.
#
# Background jobs are rows in PostgreSQL, so they survive restarts and free-instance spin-downs. To move processing
# off the web instance (paid plans only), uncomment the worker service and set RUN_WORKER_IN_API=false on the web service.
#
# Plans: the free web plan sleeps after ~15 minutes idle (the first request then takes ~1 minute). The free PostgreSQL plan
# has 1 GB storage and Render deletes free databases 30 days after creation unless upgraded - use a paid plan
# (e.g. basic-256mb) for anything you want to keep. Only one free PostgreSQL database is allowed per Render workspace.
#
# Secrets: JWT_SECRET_KEY and ENCRYPTION_KEY are generated by Render. AI keys are optional and entered in the dashboard
# (sync: false) - they are never stored in this file.

services:
  - type: web
    name: contractlens-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: contractlens-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: database
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MAX_PDF_PAGES
        value: "300"
      - key: PROCESSING_TIMEOUT_SECONDS
        value: "180"
      - key: DOCS_ENABLED
        value: "false"
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: none            # set to openai | anthropic | gemini after adding the matching key
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  # Optional dedicated worker (requires a paid instance type):
  # - type: worker
  #   name: contractlens-worker
  #   runtime: docker
  #   plan: starter
  #   region: frankfurt
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   dockerCommand: python -m app.worker
  #   envVars:
  #     - fromGroup: ...   # share the same variables as the web service (DATABASE_URL, JWT_SECRET_KEY, ENCRYPTION_KEY, STORAGE_BACKEND, AI keys)

databases:
  - name: contractlens-db
    databaseName: contractlens
    user: contractlens
    plan: free
    region: frankfurt
    ipAllowList: []   # no external connections; only services in the same Render region/workspace can connect

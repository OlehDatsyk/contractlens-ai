[project]
name = "contractlens-ai-backend"
version = "1.0.0"
description = "ContractLens AI - contract intelligence API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    "ignore::DeprecationWarning:reportlab.*",
    "ignore::DeprecationWarning:docx.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are allowed for readable rule patterns and messages
    "S101",    # assert is used for invariants and in tests
    "S105", "S106",  # false positives on token/type names
    "RUF001", "RUF002", "RUF003",  # intentional typographic characters in patterns and copy
    "SIM108", "SIM102",  # nested ifs kept where they read as policy rules
    "B008",    # FastAPI dependency defaults
    "RUF012",
    "UP017",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE", "B", "SIM"]
"app/services/rules.py" = ["C4", "SIM102"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["alembic/", "tests/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic"]
skips = ["B101"]
